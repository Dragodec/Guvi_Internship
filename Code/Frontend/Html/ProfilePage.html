<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="../Css/Index.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center min-vh-100 position-relative py-5">

    <div class="position-absolute top-0 end-0 p-4">
        <button id="logoutBtn" class="btn btn-outline-dark btn-sm px-3 py-1.5 fw-medium">
            <i class="bi bi-box-arrow-right me-1"></i> Logout
        </button>
    </div>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-6 col-lg-5">
                <div class="card border-0 shadow-sm p-4 rounded-3">
                    <div class="card-body">
                        <h1 class="h4 text-dark mb-1 fw-bold">User Profile</h1>
                        <p class="text-secondary small mb-4">Your registered account details.</p>
                        
                        <div id="alertMessage" class="alert d-none small py-2" role="alert"></div>

                        <div class="mb-3">
                            <label class="form-label small text-secondary fw-medium mb-1">Name</label>
                            <div id="displayName" class="form-control form-control-lg bg-light border-0 small text-dark d-flex align-items-center">
                                <span class="placeholder-glow w-100"><span class="placeholder col-6"></span></span>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small text-secondary fw-medium mb-1">Email address</label>
                            <div id="displayEmail" class="form-control form-control-lg bg-light border-0 small text-dark d-flex align-items-center">
                                <span class="placeholder-glow w-100"><span class="placeholder col-8"></span></span>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small text-secondary fw-medium mb-1">Contact Number</label>
                            <div id="displayContact" class="form-control form-control-lg bg-light border-0 small text-dark d-flex align-items-center">
                                <span class="placeholder-glow w-100"><span class="placeholder col-5"></span></span>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small text-secondary fw-medium mb-1">Date of Birth</label>
                            <div id="displayDob" class="form-control form-control-lg bg-light border-0 small text-dark d-flex align-items-center">
                                <span class="placeholder-glow w-100"><span class="placeholder col-4"></span></span>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label small text-secondary fw-medium mb-1">Age</label>
                            <div id="displayAge" class="form-control form-control-lg bg-light border-0 small text-dark d-flex align-items-center">
                                <span class="placeholder-glow w-100"><span class="placeholder col-3"></span></span>
                            </div>
                        </div>

                        <a href="UpdateProfilePage.html" class="btn btn-dark w-100 py-2.5 fw-medium d-flex align-items-center justify-content-center gap-2">
                            <i class="bi bi-pencil-square"></i> Update Profile
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../Js/ProfileScript.js"></script>
</body>
</html>
