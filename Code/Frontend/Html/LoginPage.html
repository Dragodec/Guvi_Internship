<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="../Css/Index.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-6 col-lg-5">
                <div class="card border-0 shadow-sm p-4 rounded-3">
                    <div class="card-body">
                        <h1 class="h4 text-dark mb-1 fw-bold">Welcome back</h1>
                        <p class="text-secondary small mb-4">Please enter your details to sign in.</p>
                        
                        <div id="alertMessage" class="alert d-none small py-2" role="alert"></div>

                        <form id="loginForm" novalidate>
                            <div class="mb-3">
                                <label for="email" class="form-label small text-secondary fw-medium">Email address</label>
                                <input type="email" class="form-control form-control-lg bg-light border-0 small" id="email" required>
                                <div class="invalid-feedback small">Please enter a valid email address.</div>
                            </div>

                            <div class="mb-4">
                                <label for="password" class="form-label small text-secondary fw-medium">Password</label>
                                <div class="input-group">
                                    <input type="password" class="form-control form-control-lg bg-light border-0 small" id="password" required>
                                    <button class="btn btn-light border-0 px-3 toggle-password" type="button" data-target="password">
                                        <i class="bi bi-eye"></i>
                                    </button>
                                    <div class="invalid-feedback small">Password is required.</div>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-dark w-100 py-2.5 fw-medium mb-3">Sign In</button>
                            
                            <div class="text-center">
                                <span class="small text-secondary">Don't have an account? </span>
                                <a href="RegisterPage.html" class="small text-dark fw-medium text-decoration-none">Sign Up</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../Js/LoginScript.js"></script>
</body>
</html>
